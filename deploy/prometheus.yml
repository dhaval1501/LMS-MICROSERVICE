global:
  scrape_interval: 15s

scrape_configs:
  - job_name: student-service
    metrics_path: /api/v1/students/actuator/prometheus
    static_configs:
      - targets: ["student-service:8081"]

  - job_name: book-service
    metrics_path: /api/v1/books/actuator/prometheus
    static_configs:
      - targets: ["book-service:8082"]

  - job_name: loan-service
    metrics_path: /api/v1/loans/actuator/prometheus
    static_configs:
      - targets: ["loan-service:8083"]

  - job_name: service-registry
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["service-registry:8761"]

  - job_name: config-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["config-server:8088"]
